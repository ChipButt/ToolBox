                  align:JSON.parse(localStorage.getItem('chipin-world-builder-v1')).editor.signPopupStyle.textAlign,
                  hidden:document.querySelector('#signOverlay')?.hidden
                };
              """)
              print('SIGN_PLAY_STATE',json.dumps(sign_play,sort_keys=True))
              if sign_play['message'] != 'Welcome to the winter village!' or sign_play['title'] != 'Village Notice' or sign_play['width'] != '220px' or sign_play['hidden'] or sign_play['align'] != 'center' or sign_play['pixelAlpha'] <= 0:
                  raise AssertionError(f"pixel sign popup did not display correctly over playtest: {sign_play}")
              driver.execute_script("document.querySelector('#signPopupClose').click();document.querySelector('#stopPlaytest').click()")

              # Large assets expose a 16px per-tile ABOVE/BELOW mask.
              depth_state=driver.execute_script("""
                const card=document.querySelector('#assetList .assetCard[data-asset-name="house2.png"]');
                if(!card)throw new Error('house2 palette card not found');
                card.click();
                const canvas=document.querySelector('#worldCanvas'),r=canvas.getBoundingClientRect(),wx=400,wy=96;
                canvas.dispatchEvent(new PointerEvent('pointerdown',{
                  bubbles:true,cancelable:true,pointerId:303,pointerType:'mouse',button:0,buttons:1,
                  clientX:r.left+wx*(r.width/canvas.width),clientY:r.top+wy*(r.height/canvas.height)
                }));
                const cells=[...document.querySelectorAll('#depthTileGrid .depthTileCell')];
                if(cells.length!==15)throw new Error('Expected 5x3 house depth grid, got '+cells.length);
                document.querySelector('[data-depth-cell="2,0"]').click();
                document.querySelector('[data-depth-cell="2,1"]').click();
                const p=JSON.parse(localStorage.getItem('chipin-world-builder-v1'));
                const m=p.maps.find(x=>x.id===p.startMapId),house=m.assets.filter(a=>a.asset==='house2.png').at(-1);
                return {cells:cells.length,enabled:house.tileDepthEnabled,above:[...house.depthAboveTiles].sort(),w:house.w,h:house.h};
              """)
              print('DEPTH_TILE_STATE',json.dumps(depth_state,sort_keys=True))
              if depth_state['cells'] != 15 or not depth_state['enabled'] or depth_state['above'] != ['2,0','2,1']:
                  raise AssertionError(f"per-tile character depth failed: {depth_state}")

              # NPCs explicitly support stationary idle mode or a drawn walking route, plus dialogue and quest data.
              npc_state=driver.execute_script("""
                document.querySelector('.modeBtn[data-mode="npc"]').click();
                const canvas=document.querySelector('#worldCanvas'),r=canvas.getBoundingClientRect();
                const point=(id,wx,wy)=>{
                  canvas.dispatchEvent(new PointerEvent('pointerdown',{
                    bubbles:true,cancelable:true,pointerId:id,pointerType:'mouse',button:0,buttons:1,
                    clientX:r.left+wx*(r.width/canvas.width),clientY:r.top+wy*(r.height/canvas.height)
                  }));
                };
