              """,link_setup['sourceId'],link_setup['linkId'])
              print('MAP_LINK_ARRIVAL_STATE',json.dumps(arrival_saved,sort_keys=True))
              if arrival_saved['targetMapId'] != link_setup['targetId'] or arrival_saved['targetX'] != 520 or arrival_saved['targetY'] != 360 or not arrival_saved['arrivalSet']:
                  raise AssertionError(f"Map Link arrival square was not saved correctly: {arrival_saved}")
