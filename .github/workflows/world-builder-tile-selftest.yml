                  raise AssertionError(f"playtest player is not using animated TF Elf A sheet: {player_character}")

              driver.execute_script("document.querySelector('#saveProject').click()")
              driver.execute_cdp_cmd('Network.clearBrowserCache', {})
              driver.refresh()
              wait_ready()
              feature_persisted=driver.execute_script("""
                const p=JSON.parse(localStorage.getItem('chipin-world-builder-v1')),m=p.maps.find(x=>x.id===p.startMapId);
                const sign=m.assets.find(a=>a.id===arguments[0]),house=m.assets.filter(a=>a.asset==='house2.png').at(-1),n=m.npcs.at(-1);
