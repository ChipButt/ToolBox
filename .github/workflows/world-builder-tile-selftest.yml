                };
              """,sign_state['id'])
              print('FEATURE_REFRESH_STATE',json.dumps(feature_persisted,sort_keys=True))
              if feature_persisted != {'sign':'Welcome to the winter village!','styleWidth':220,'signAlign':'center','depthEnabled':True,'depthAbove':['2,0','2,1'],'npcMovement':'path','npcPath':2,'npcQuest':True,'npcMod':[8,8],'npcSize':[40,56]}:
                  raise AssertionError(f"new sign/depth/NPC features did not survive refresh: {feature_persisted}")

              severe=[]
              for entry in driver.get_log('browser'):
                  print('BROWSER_LOG',entry['level'],entry['message'])
                  if entry['level']=='SEVERE' and 'favicon.ico' not in entry['message']:
                      severe.append(entry['message'])
              if severe:
                  raise AssertionError('unexpected severe browser logs: '+json.dumps(severe))
          finally:
