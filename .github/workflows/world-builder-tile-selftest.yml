              # Playtest starts inside the source Map Link and must arrive at the marked target square.
              driver.execute_script("document.querySelector('#playtestBtn').click()")
              WebDriverWait(driver, 5).until(lambda d: d.execute_script(
                  "return document.querySelector('#playMapName')?.textContent===arguments[0]",link_setup['targetName']
