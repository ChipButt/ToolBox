              if sign_state['styleWidth'] != 220 or sign_state['align'] != 'center' or sign_state['preview'] != 'Welcome to the winter village!' or sign_state['pixelAlpha'] <= 0:
                  raise AssertionError(f"pixel sign popup designer failed: {sign_state}")

              driver.execute_script("document.querySelector('#playtestBtn').click()")
              WebDriverWait(driver,5).until(lambda d:d.execute_script("return document.body.classList.contains('mobilePlaytest')"))
              driver.execute_script("document.querySelector('#mobileInteract').dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerId:302,pointerType:'mouse',button:0,buttons:1}))")
              WebDriverWait(driver,5).until(lambda d:d.execute_script("return document.querySelector('#signOverlay')?.hidden===false"))
              sign_play=driver.execute_script("""
