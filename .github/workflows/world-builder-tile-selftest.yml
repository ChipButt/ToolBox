                  raise AssertionError(f"export/backup is incomplete: {download_state}")

              # Sign-post interaction: message entry, popup designer, and in-play popup over the map.
              sign_state=driver.execute_script("""
                document.querySelectorAll('#mapList .mapItem')[0].click();
