                align.value='center';align.dispatchEvent(new Event('change',{bubbles:true}));
                const previewCanvas=document.querySelector('#signPopupPreview .signPixelCanvas'),px=previewCanvas?.getContext('2d')?.getImageData(0,0,previewCanvas.width,previewCanvas.height).data;
                const pixelAlpha=px?[...px].filter((v,i)=>i%4===3&&v>0).length:0;
                const p=JSON.parse(localStorage.getItem('chipin-world-builder-v1'));
