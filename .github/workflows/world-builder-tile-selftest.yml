name: World Builder tile self-test

on:
  push:
    paths:
      - 'world-builder-uploaded-tiles-data-*.js'
      - 'world-builder-uploaded-tiles-runtime.js'
      - 'world-builder.js'
      - 'world-builder.html'
      - 'world-builder.css'
      - '.github/workflows/world-builder-tile-selftest.yml'
  workflow_dispatch:

jobs:
  decode-uploaded-tiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode and validate 312 uploaded tiles
        run: |
          node <<'NODE'
          const fs=require('fs'), zlib=require('zlib');
          const files=[1,2,3,4].map(n=>`world-builder-uploaded-tiles-data-${n}.js`);
          let pack='';
          for(const file of files){
            const src=fs.readFileSync(file,'utf8');
            const m=src.match(/\+"([A-Za-z0-9+/=]+)";?\s*$/);
            if(!m) throw new Error('Could not extract base64 chunk from '+file);
            pack += m[1];
          }
          console.log('base64 chars',pack.length);
          const compressed=Buffer.from(pack,'base64');
          console.log('gzip bytes',compressed.length,'header',compressed.subarray(0,10).toString('hex'));
          const b=zlib.gunzipSync(compressed);
          console.log('decoded bytes',b.length,'first32',b.subarray(0,32).toString('hex'));
          let p=0;
          const u16=()=>{ if(p+2>b.length)throw new Error('u16 OOB @'+p); const v=b[p]|(b[p+1]<<8); p+=2; return v; };
          const u32=()=>{ if(p+4>b.length)throw new Error('u32 OOB @'+p); const v=(b[p]|(b[p+1]<<8)|(b[p+2]<<16)|(b[p+3]<<24))>>>0; p+=4; return v; };
          const u8=()=>{ if(p>=b.length)throw new Error('u8 OOB @'+p); return b[p++]; };
          const count=u16();
          console.log('asset count',count);
          const names=[];
          for(let a=0;a<count;a++){
            const start=p;
            const nl=u8();
            if(p+nl>b.length)throw new Error(`name OOB asset ${a} start ${start} nl ${nl}`);
            const name=b.subarray(p,p+nl).toString('utf8'); p+=nl;
            const width=u16(),height=u16(),pc=u8();
            const paletteBytes=pc*4;
            if(p+paletteBytes>b.length)throw new Error(`palette OOB asset ${a} ${name} pc ${pc} @${p}`);
            p+=paletteBytes;
            const rc=u32();
            let pixel=0;
            for(let r=0;r<rc;r++){
              const len=u16(),ci=u8();
              if(ci>=pc)throw new Error(`palette index OOB asset ${a} ${name} run ${r}: ci ${ci}, pc ${pc}, start ${start}`);
              pixel+=len;
              if(pixel>width*height)throw new Error(`pixel overflow asset ${a} ${name}: ${pixel}/${width*height}, rc ${rc}, start ${start}`);
            }
            if(pixel!==width*height)throw new Error(`pixel mismatch asset ${a} ${name}: ${pixel}/${width*height}, pc ${pc}, rc ${rc}, start ${start}, end ${p}`);
            names.push(name);
          }
          console.log('parsed',names.length,'assets; remaining bytes',b.length-p);
          console.log('first',names.slice(0,5));
          console.log('last',names.slice(-5));
          if(count!==312||names.length!==312)throw new Error('Expected 312 assets');
          if(p!==b.length)throw new Error('Trailing decoded bytes: '+(b.length-p));
          NODE
      - name: Guard against single-selector forEach regression
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('world-builder.js','utf8');
          const bad=src.split(/\r?\n/).map((line,i)=>({line:i+1,text:line}))
            .filter(x=>/(^|[^$])\$\([^;]*?\)\.forEach\s*\(/.test(x.text));
          if(bad.length){
            console.error('Invalid $().forEach() usage:',bad);
            process.exit(1);
          }
          console.log('world-builder.js selector iteration check passed');
          NODE
      - name: Browser runtime and persistence diagnostic
        run: |
          python3 -m http.server 8000 >/tmp/world-builder-http.log 2>&1 &
          python3 -m pip install --quiet selenium
          python3 <<'PY'
          import json, time, urllib.request, os, pathlib
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.action_chains import ActionChains

          URL='http://127.0.0.1:8000/world-builder.html'
          STORE='chipin-world-builder-v1'
          DOWNLOAD_DIR='/tmp/world-builder-downloads'
          os.makedirs(DOWNLOAD_DIR, exist_ok=True)

          for _ in range(50):
              try:
                  urllib.request.urlopen(URL, timeout=1).read(64)
                  break
              except Exception:
                  time.sleep(0.1)
          else:
              raise RuntimeError('local web server did not start')

          options=Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1440,1200')
          options.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          options.add_experimental_option('prefs', {
              'download.default_directory': DOWNLOAD_DIR,
              'download.prompt_for_download': False,
              'download.directory_upgrade': True,
              'safebrowsing.enabled': True
          })
          driver=webdriver.Chrome(options=options)
          driver.execute_cdp_cmd('Page.setDownloadBehavior', {'behavior':'allow','downloadPath':DOWNLOAD_DIR})

          def wait_ready():
              WebDriverWait(driver, 20).until(lambda d: d.execute_script(
                  "return !!window.WorldBuilderSheetAssets && (window.WorldBuilderSheetAssets.loaded || !!window.WorldBuilderSheetAssets.loadError)"
              ))
              WebDriverWait(driver, 20).until(lambda d: d.execute_script(
                  "return document.querySelectorAll('#assetList .assetCard').length===370"
              ))

          def snapshot():
              return driver.execute_script("""
                const api=window.WorldBuilderSheetAssets;
                const pixelData=c=>Array.from(c.getContext('2d').getImageData(0,0,c.width,c.height).data);
                const summary=c=>{
                  const d=pixelData(c);let alpha=0,rgb=0;
                  for(let i=0;i<d.length;i+=4){alpha+=d[i+3];rgb+=d[i]+d[i+1]+d[i+2];}
                  return {width:c.width,height:c.height,alphaSum:alpha,rgbSum:rgb};
                };
                const compareThumb=name=>{
                  const direct=api.canvas(name);
                  const card=[...document.querySelectorAll('#assetList .assetCard')]
                    .find(x=>x.textContent.includes(name));
                  const thumb=card?.querySelector('canvas')||null;
                  if(!thumb)return {card:false,match:false,direct:summary(direct),thumb:null};
                  const a=pixelData(direct),b=pixelData(thumb);
                  return {
                    card:true,
                    match:direct.width===thumb.width && direct.height===thumb.height &&
                      a.length===b.length && a.every((v,i)=>v===b[i]),
                    direct:summary(direct),
                    thumb:summary(thumb)
                  };
                };
                const allChip=document.querySelector('.categoryChip[data-category="all"]')?.textContent||'';
                return {
                  loaded:api.loaded,
                  loadError:api.loadError ? String(api.loadError.stack||api.loadError.message||api.loadError) : null,
                  uploadedNames:api.names.length,
                  cards:document.querySelectorAll('#assetList .assetCard').length,
                  allChip,
                  dungeon:compareThumb('Dungeon r00 c01'),
                  bigset:compareThumb('BigSet r00 c00'),
                  modeStatus:document.querySelector('#modeStatus')?.textContent||''
                };
              """)

          try:
              driver.get(URL)
              wait_ready()
              state=snapshot()
              print('BROWSER_STATE',json.dumps(state,sort_keys=True))

              if state['uploadedNames'] != 312:
                  raise AssertionError(f"expected 312 uploaded names, got {state['uploadedNames']}")
              if not state['loaded']:
                  raise AssertionError(f"uploaded runtime failed: {state['loadError']}")
              if state['cards'] != 370 or 'All (370)' not in state['allChip']:
                  raise AssertionError(f"expected All (370) and 370 cards, got {state['allChip']!r}, {state['cards']}")
              for family in ('dungeon','bigset'):
                  item=state[family]
                  if not item['card'] or not item['match']:
                      raise AssertionError(f"{family} palette thumbnail does not exactly match decoded artwork: {item}")
                  if item['direct']['alphaSum'] == 0:
                      raise AssertionError(f"{family} decoded artwork is blank")

              # Select a real uploaded Dungeon tile through the palette and stamp it through the actual canvas pointer handler.
              stamp=driver.execute_script("""
                const name='Dungeon r00 c01';
                const card=[...document.querySelectorAll('#assetList .assetCard')]
                  .find(x=>x.textContent.includes(name));
                if(!card)throw new Error('Dungeon palette card not found');
                card.click();
                const canvas=document.querySelector('#worldCanvas'),r=canvas.getBoundingClientRect();
                const x=r.left+96*(r.width/canvas.width),y=r.top+96*(r.height/canvas.height);
                canvas.dispatchEvent(new PointerEvent('pointerdown',{
                  bubbles:true,cancelable:true,pointerId:91,pointerType:'mouse',button:0,buttons:1,clientX:x,clientY:y
                }));
                canvas.dispatchEvent(new PointerEvent('pointerup',{
                  bubbles:true,cancelable:true,pointerId:91,pointerType:'mouse',button:0,buttons:0,clientX:x,clientY:y
                }));
                document.querySelector('#saveProject').click();
                const p=JSON.parse(localStorage.getItem('chipin-world-builder-v1'));
                const m=p.maps.find(x=>x.id===p.activeMapId)||p.maps[0];
                const placed=m.assets.filter(a=>a.asset===name);
                return {
                  placed:placed.length,
                  last:placed.at(-1)||null,
                  totalMapAssets:m.assets.length,
                  status:document.querySelector('#modeStatus')?.textContent||''
                };
              """)
              print('STAMP_STATE',json.dumps(stamp,sort_keys=True))
              if stamp['placed'] < 1 or not stamp['last']:
                  raise AssertionError('Dungeon tile was not stamped into the map')
              if stamp['last']['w'] != 16 or stamp['last']['h'] != 16:
                  raise AssertionError(f"stamped uploaded tile has wrong size: {stamp['last']}")

              # Hard refresh: clear HTTP cache but preserve localStorage, then prove the saved placement survives.
              driver.execute_cdp_cmd('Network.clearBrowserCache', {})
              driver.refresh()
              wait_ready()
              persisted=driver.execute_script("""
                const p=JSON.parse(localStorage.getItem('chipin-world-builder-v1'));
                const m=p.maps.find(x=>x.id===p.activeMapId)||p.maps[0];
                const placed=m.assets.filter(a=>a.asset==='Dungeon r00 c01');
                const api=window.WorldBuilderSheetAssets;
                let canvasOk=false;
                try{
                  const c=api.canvas('Dungeon r00 c01');
                  const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;
                  canvasOk=Array.from(d).some((v,i)=>i%4===3&&v>0);
                }catch(_){}
                return {
                  placed:placed.length,
                  allChip:document.querySelector('.categoryChip[data-category="all"]')?.textContent||'',
                  cards:document.querySelectorAll('#assetList .assetCard').length,
                  loaded:api.loaded,
                  canvasOk
                };
              """)
              print('REFRESH_STATE',json.dumps(persisted,sort_keys=True))
              if persisted['placed'] < 1:
                  raise AssertionError('saved Dungeon placement did not survive hard refresh')
              if persisted['cards'] != 370 or 'All (370)' not in persisted['allChip']:
                  raise AssertionError('asset catalogue did not survive hard refresh at 370 assets')
              if not persisted['loaded'] or not persisted['canvasOk']:
                  raise AssertionError('uploaded artwork did not survive hard refresh')

              # Prove a non-square placed asset rotates by 90 degrees with its bounding box swapped.
              rotation=driver.execute_script("""
                const name='couch-horizontal';
                const card=[...document.querySelectorAll('#assetList .assetCard')]
                  .find(x=>x.textContent.includes('Couch — Horizontal')||x.textContent.includes(name));
                if(!card)throw new Error('Couch — Horizontal palette card not found');
                card.click();
                const canvas=document.querySelector('#worldCanvas'),r=canvas.getBoundingClientRect();
                const x=r.left+160*(r.width/canvas.width),y=r.top+96*(r.height/canvas.height);
                canvas.dispatchEvent(new PointerEvent('pointerdown',{
                  bubbles:true,cancelable:true,pointerId:92,pointerType:'mouse',button:0,buttons:1,clientX:x,clientY:y
                }));
                canvas.dispatchEvent(new PointerEvent('pointerup',{
                  bubbles:true,cancelable:true,pointerId:92,pointerType:'mouse',button:0,buttons:0,clientX:x,clientY:y
                }));
                const before={
                  rotation:Number(document.querySelector('.rotationReadout')?.textContent?.replace('°',''))||0,
                  w:Number(document.querySelector('#selW')?.value)||0,
                  h:Number(document.querySelector('#selH')?.value)||0
                };
                document.querySelector('#rotateRight')?.click();
                document.querySelector('#saveProject').click();
                const p=JSON.parse(localStorage.getItem('chipin-world-builder-v1'));
                const m=p.maps.find(x=>x.id===p.activeMapId)||p.maps[0];
                const placed=m.assets.filter(a=>a.asset===name).at(-1);
                return {
                  before,
                  after:placed?{rotation:placed.rotation,w:placed.w,h:placed.h,x:placed.x,y:placed.y}:null,
                  readout:document.querySelector('.rotationReadout')?.textContent||''
                };
              """)
              print('ROTATION_STATE',json.dumps(rotation,sort_keys=True))
              if not rotation.get('after'):
                  raise AssertionError('Couch rotation test asset was not placed')
              if rotation['before']['w'] != 32 or rotation['before']['h'] != 16:
                  raise AssertionError(f"unexpected Couch — Horizontal starting size: {rotation['before']}")
              if rotation['after']['rotation'] != 90 or rotation['after']['w'] != 16 or rotation['after']['h'] != 32:
                  raise AssertionError(f"90 degree rotation did not swap bounds correctly: {rotation['after']}")
              if rotation['readout'] != '90°':
                  raise AssertionError(f"rotation inspector readout is wrong: {rotation['readout']!r}")

              driver.execute_cdp_cmd('Network.clearBrowserCache', {})
              driver.refresh()
              wait_ready()
              rotation_persisted=driver.execute_script("""
                const p=JSON.parse(localStorage.getItem('chipin-world-builder-v1'));
                const m=p.maps.find(x=>x.id===p.activeMapId)||p.maps[0];
                const placed=m.assets.filter(a=>a.asset==='couch-horizontal').at(-1);
                return placed?{rotation:placed.rotation,w:placed.w,h:placed.h}:null;
              """)
              print('ROTATION_REFRESH_STATE',json.dumps(rotation_persisted,sort_keys=True))
              if rotation_persisted != {'rotation':90,'w':16,'h':32}:
                  raise AssertionError(f"rotated asset did not survive hard refresh: {rotation_persisted}")

              # Fill a dragged 48x32 area with a 16x16 uploaded tile: 3 columns x 2 rows.
              driver.execute_script("""
                const name='Dungeon r00 c01';
                const card=[...document.querySelectorAll('#assetList .assetCard')].find(x=>x.textContent.includes(name));
                if(!card)throw new Error('Dungeon palette card not found for fill test');
                card.click();
                document.querySelector('.modeBtn[data-mode="fill"]').click();
              """)
              canvas=driver.find_element(By.ID,'worldCanvas')
              rect=canvas.rect
              start_x,start_y=240,160
              ActionChains(driver).move_to_element_with_offset(
                  canvas,start_x-rect['width']/2,start_y-rect['height']/2
              ).click_and_hold().move_by_offset(48,32).release().perform()
              WebDriverWait(driver, 5).until(lambda d: d.execute_script(
                  "return document.querySelector('#selectionTitle')?.textContent==='6 assets selected'"
              ))

              fill_state=driver.execute_script("""
                const p=JSON.parse(localStorage.getItem('chipin-world-builder-v1'));
                const m=p.maps.find(x=>x.id===p.activeMapId)||p.maps[0];
                const tiles=m.assets.filter(a=>a.asset==='Dungeon r00 c01'&&a.x>=240&&a.x<288&&a.y>=160&&a.y<192);
                return {
                  count:tiles.length,
                  positions:tiles.map(a=>[a.x,a.y]).sort((a,b)=>a[1]-b[1]||a[0]-b[0]),
                  title:document.querySelector('#selectionTitle')?.textContent||'',
                  hasBatchControls:!!document.querySelector('#multiLayer')&&!!document.querySelector('#multiSolid')&&!!document.querySelector('#multiAbove')
                };
              """)
              print('FILL_STATE',json.dumps(fill_state,sort_keys=True))
              if fill_state['count'] != 6 or not fill_state['hasBatchControls']:
                  raise AssertionError(f"area fill did not create/select six tiles: {fill_state}")

              # Batch-edit the six newly selected placed assets.
              batch_state=driver.execute_script("""
                const change=(selector,value)=>{
                  const el=document.querySelector(selector);
                  if(!el)throw new Error('Missing batch control '+selector);
                  el.value=value;
                  el.dispatchEvent(new Event('change',{bubbles:true}));
                };
                change('#multiLayer','7');
                change('#multiSolid','true');
                change('#multiAbove','true');
                const p=JSON.parse(localStorage.getItem('chipin-world-builder-v1'));
                const m=p.maps.find(x=>x.id===p.activeMapId)||p.maps[0];
                const tiles=m.assets.filter(a=>a.asset==='Dungeon r00 c01'&&a.x>=240&&a.x<288&&a.y>=160&&a.y<192);
                document.querySelector('#saveProject').click();
                return {
                  count:tiles.length,
                  layers:[...new Set(tiles.map(a=>a.layer))],
                  solid:[...new Set(tiles.map(a=>a.solid))],
                  above:[...new Set(tiles.map(a=>a.aboveCharacters))]
                };
              """)
              print('BATCH_STATE',json.dumps(batch_state,sort_keys=True))
              if batch_state != {'count':6,'layers':[7],'solid':[True],'above':[True]}:
                  raise AssertionError(f"batch asset state update failed: {batch_state}")

              driver.execute_cdp_cmd('Network.clearBrowserCache', {})
              driver.refresh()
              wait_ready()
              batch_persisted=driver.execute_script("""
                const p=JSON.parse(localStorage.getItem('chipin-world-builder-v1'));
                const m=p.maps.find(x=>x.id===p.activeMapId)||p.maps[0];
                const tiles=m.assets.filter(a=>a.asset==='Dungeon r00 c01'&&a.x>=240&&a.x<288&&a.y>=160&&a.y<192);
                return {
                  count:tiles.length,
                  layers:[...new Set(tiles.map(a=>a.layer))],
                  solid:[...new Set(tiles.map(a=>a.solid))],
                  above:[...new Set(tiles.map(a=>a.aboveCharacters))]
                };
              """)
              print('BATCH_REFRESH_STATE',json.dumps(batch_persisted,sort_keys=True))
              if batch_persisted != {'count':6,'layers':[7],'solid':[True],'above':[True]}:
                  raise AssertionError(f"batch asset state update did not survive hard refresh: {batch_persisted}")

              # Spawn tool must target a grid square centre, not a grid intersection.
              spawn_state=driver.execute_script("""
                document.querySelector('.modeBtn[data-mode="spawn"]').click();
                const canvas=document.querySelector('#worldCanvas'),r=canvas.getBoundingClientRect();
                const wx=331,wy=219;
                const clientX=r.left+wx*(r.width/canvas.width),clientY=r.top+wy*(r.height/canvas.height);
                canvas.dispatchEvent(new PointerEvent('pointerdown',{
                  bubbles:true,cancelable:true,pointerId:123,pointerType:'mouse',button:0,buttons:1,clientX,clientY
                }));
                const p=JSON.parse(localStorage.getItem('chipin-world-builder-v1'));
                document.querySelector('#saveProject').click();
                return {
                  x:p.initialSpawn.x,y:p.initialSpawn.y,
                  xMod:p.initialSpawn.x%16,yMod:p.initialSpawn.y%16,
                  startMapId:p.startMapId,activeMapId:p.activeMapId,
                  perMapSpawnFields:p.maps.filter(m=>Object.prototype.hasOwnProperty.call(m,'spawn')).length,
                  status:document.querySelector('#modeStatus')?.textContent||''
                };
              """)
              print('SPAWN_STATE',json.dumps(spawn_state,sort_keys=True))
              if spawn_state['x'] != 328 or spawn_state['y'] != 216 or spawn_state['xMod'] != 8 or spawn_state['yMod'] != 8:
                  raise AssertionError(f"initial spawn was not centred in the clicked grid square: {spawn_state}")
              if spawn_state['startMapId'] != spawn_state['activeMapId'] or spawn_state['perMapSpawnFields'] != 0:
                  raise AssertionError(f"spawn is not a single global initial spawn: {spawn_state}")

              driver.execute_cdp_cmd('Network.clearBrowserCache', {})
              driver.refresh()
              wait_ready()
              spawn_persisted=driver.execute_script("""
                const p=JSON.parse(localStorage.getItem('chipin-world-builder-v1'));
                return {x:p.initialSpawn.x,y:p.initialSpawn.y,xMod:p.initialSpawn.x%16,yMod:p.initialSpawn.y%16,startMapId:p.startMapId};
              """)
              print('SPAWN_REFRESH_STATE',json.dumps(spawn_persisted,sort_keys=True))
              if spawn_persisted['x'] != 328 or spawn_persisted['y'] != 216 or spawn_persisted['xMod'] != 8 or spawn_persisted['yMod'] != 8:
                  raise AssertionError(f"global initial spawn did not survive hard refresh: {spawn_persisted}")

              # Create a second map and prove a Map Link can mark an exact arrival square there.
              link_setup=driver.execute_script("""
                document.querySelector('#addMap').click();
                let p=JSON.parse(localStorage.getItem('chipin-world-builder-v1'));
                const targetId=p.activeMapId,target=p.maps.find(m=>m.id===targetId);
                const source=p.maps[0];
                document.querySelectorAll('#mapList .mapItem')[0].click();
                document.querySelector('.modeBtn[data-mode="transition"]').click();
                const canvas=document.querySelector('#worldCanvas'),r=canvas.getBoundingClientRect();
                const fire=(type,wx,wy,buttons)=>{
                  canvas.dispatchEvent(new PointerEvent(type,{
                    bubbles:true,cancelable:true,pointerId:211,pointerType:'mouse',
                    button:0,buttons,
                    clientX:r.left+wx*(r.width/canvas.width),clientY:r.top+wy*(r.height/canvas.height)
                  }));
                };
                fire('pointerdown',320,208,1);
                fire('pointermove',336,224,1);
                fire('pointerup',336,224,0);
                p=JSON.parse(localStorage.getItem('chipin-world-builder-v1'));
                const sourceNow=p.maps.find(m=>m.id===source.id);
                const link=sourceNow.transitions.at(-1);
                return {
                  sourceId:source.id,targetId,targetName:target.name,
                  linkId:link?.id||null,linkTarget:link?.targetMapId||null,
                  arrivalSet:!!link?.arrivalSet,
                  hasArrivalButton:!!document.querySelector('#setLinkArrival')
                };
              """)
              print('MAP_LINK_SETUP',json.dumps(link_setup,sort_keys=True))
              if not link_setup['linkId'] or link_setup['linkTarget'] != link_setup['targetId'] or not link_setup['hasArrivalButton']:
                  raise AssertionError(f"Map Link setup failed: {link_setup}")
              if link_setup['arrivalSet']:
                  raise AssertionError(f"new Map Link should require an explicit arrival square: {link_setup}")

              arrival_target=driver.execute_script("""
                document.querySelector('#setLinkArrival').click();
                return {
                  mapTitle:document.querySelector('#mapInspectorTitle')?.textContent||'',
                  status:document.querySelector('#modeStatus')?.textContent||''
                };
              """)
              print('MAP_LINK_TARGET_VIEW',json.dumps(arrival_target,sort_keys=True))
              if arrival_target['mapTitle'] != link_setup['targetName']:
                  raise AssertionError(f"arrival editor did not open the target map: {arrival_target}")

              driver.execute_script("""
                const canvas=document.querySelector('#worldCanvas'),r=canvas.getBoundingClientRect();
                const wx=523,wy=363;
                canvas.dispatchEvent(new PointerEvent('pointerdown',{
                  bubbles:true,cancelable:true,pointerId:212,pointerType:'mouse',button:0,buttons:1,
                  clientX:r.left+wx*(r.width/canvas.width),clientY:r.top+wy*(r.height/canvas.height)
                }));
              """)

              # Read the saved link directly after the arrival click auto-returns to the source map.
              arrival_saved=driver.execute_script("""
                const p=JSON.parse(localStorage.getItem('chipin-world-builder-v1'));
                const source=p.maps.find(m=>m.id===arguments[0]);
                const link=source.transitions.find(t=>t.id===arguments[1]);
                document.querySelector('#saveProject').click();
                return {
                  activeMapId:p.activeMapId,
                  targetMapId:link.targetMapId,
                  targetX:link.targetX,targetY:link.targetY,arrivalSet:!!link.arrivalSet,
