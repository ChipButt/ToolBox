                const movement=document.querySelector('#npcMovement'),dialogue=document.querySelector('#npcDialogue'),quest=document.querySelector('#questEnabled');
                const width=document.querySelector('#npcWidth'),height=document.querySelector('#npcHeight'),resetSize=document.querySelector('#resetNpcSize');
                const initialMovement=movement?.value,hasIdle=!!document.querySelector('#npcIdleAnimated'),hasResize=!!width&&!!height&&!!resetSize;
