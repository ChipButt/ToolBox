name: Import Quaternius Pack 2 Ultimate Nature assets

on:
  push:
    branches:
      - pack2-import-helper
    paths:
      - .github/workflows/import-pack2-ultimate-nature.yml

permissions:
  contents: write

concurrency:
  group: pack2-ultimate-nature-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install gdown
        run: python -m pip install --disable-pip-version-check gdown

      - name: Download exact official Quaternius batch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/quaternius
          mkdir -p /tmp/quaternius
          python - <<'PY2'
          import hashlib
          import os
          import gdown

          url = "https://drive.google.com/drive/folders/1-Kl0L_Jg8awbh0S5T-z3zxh4mVlnxTpa?usp=sharing"
          wanted = {
              "BushBerries_1.fbx": "1e70f836ae535b5e8bc7096abfa5f7fe2517ea8baa6d06964eff5296e39d7edc",
              "BushBerries_2.fbx": "02c360d6c2738e3ef42610aee3b00604ff2c5722cb6b773e23fa78f6d38cece4",
              "Bush_1.fbx": "ef4fd15c36fd95a19aa769a15b4acde2a22bbfea4ada7144ece5fd82c2e05a0f",
              "Bush_2.fbx": "73a9aa512b2967ad333451ffb4b4e460f400a7a17a73a0b90fc1656404273388",
              "Bush_Snow_1.fbx": "49b33c2b7379de7194af89c0262ef648ba99ea3c4de47e961c297e067ac7bd85",
              "Bush_Snow_2.fbx": "22ef7a5ffddfb257f09d96540349b7ed4c25cb04e5f9bf5be4836ea6eff346bc",
              "CactusFlower_1.fbx": "203723aa277e0297eccc145d2d9714fa4649dac84d475b9ed60957791cbfe9a0",
              "CactusFlowers_2.fbx": "28e9efc16d2e9dd4720444cea6d583c10a3a97845ab8ac55282d36c2d28d62a9",
              "CactusFlowers_3.fbx": "0dec00002d8e3b30ebb582e5bb15bef4496ddce5916ce175caceafc96d35609a",
              "CactusFlowers_4.fbx": "fb014c097af2ae320790eb263577e08003a8a489aa3d43cb26521d5f5d239035",
          }

          files = gdown.download_folder(
              url=url,
              output="/tmp/quaternius-list",
              quiet=False,
              use_cookies=False,
              skip_download=True,
          )
          by_name = {}
          for item in files:
              name = os.path.basename(item.path)
              if name in wanted:
                  by_name[name] = item

          missing = [name for name in wanted if name not in by_name]
          if missing:
              raise SystemExit("Missing official Drive files: " + ", ".join(missing))

          for name, expected in wanted.items():
              item = by_name[name]
              out = os.path.join("/tmp/quaternius", name)
              gdown.download(
                  id=item.id,
                  output=out,
                  quiet=False,
                  use_cookies=False,
              )
              with open(out, "rb") as fh:
                  data = fh.read()
              actual = hashlib.sha256(data).hexdigest()
              print(name, item.id, actual)
              if actual != expected:
                  raise SystemExit(
                      f"Checksum mismatch for {name}: expected={expected} actual={actual}"
                  )
              if not data.startswith(b"Kaydara FBX Binary"):
                  raise SystemExit(f"Unexpected FBX header for {name}")
          PY2

      - name: Import verified batch one FBX per commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          src_dir="/tmp/quaternius"
          dest_dir="assets/gamebox/quaternius/ultimate-nature"

          import_one() {
            name="$1"
            expected="$2"
            src="$src_dir/$name"
            [ -f "$src" ] || { echo "Missing source: $name"; exit 1; }
            actual="$(sha256sum "$src" | awk '{print $1}')"
            [ "$actual" = "$expected" ] || { echo "Checksum mismatch for $name"; exit 1; }

            git fetch origin main
            git checkout main
            git reset --hard origin/main
            mkdir -p "$dest_dir"
            dest="$dest_dir/$name"

            if [ -f "$dest" ]; then
              current="$(sha256sum "$dest" | awk '{print $1}')"
              if [ "$current" = "$expected" ]; then
                echo "$name already present with exact checksum; skipping."
                return 0
              fi
              echo "$name exists with different bytes; refusing overwrite."
              exit 1
            fi

            cp "$src" "$dest"
            verify="$(sha256sum "$dest" | awk '{print $1}')"
            [ "$verify" = "$expected" ] || { echo "Post-copy checksum mismatch for $name"; exit 1; }

            git add "$dest"
            git commit -m "Import Quaternius Ultimate Nature $name"
            git push origin HEAD:main
          }

          import_one "BushBerries_1.fbx" "1e70f836ae535b5e8bc7096abfa5f7fe2517ea8baa6d06964eff5296e39d7edc"
          import_one "BushBerries_2.fbx" "02c360d6c2738e3ef42610aee3b00604ff2c5722cb6b773e23fa78f6d38cece4"
          import_one "Bush_1.fbx" "ef4fd15c36fd95a19aa769a15b4acde2a22bbfea4ada7144ece5fd82c2e05a0f"
          import_one "Bush_2.fbx" "73a9aa512b2967ad333451ffb4b4e460f400a7a17a73a0b90fc1656404273388"
          import_one "Bush_Snow_1.fbx" "49b33c2b7379de7194af89c0262ef648ba99ea3c4de47e961c297e067ac7bd85"
          import_one "Bush_Snow_2.fbx" "22ef7a5ffddfb257f09d96540349b7ed4c25cb04e5f9bf5be4836ea6eff346bc"
          import_one "CactusFlower_1.fbx" "203723aa277e0297eccc145d2d9714fa4649dac84d475b9ed60957791cbfe9a0"
          import_one "CactusFlowers_2.fbx" "28e9efc16d2e9dd4720444cea6d583c10a3a97845ab8ac55282d36c2d28d62a9"
          import_one "CactusFlowers_3.fbx" "0dec00002d8e3b30ebb582e5bb15bef4496ddce5916ce175caceafc96d35609a"
          import_one "CactusFlowers_4.fbx" "fb014c097af2ae320790eb263577e08003a8a489aa3d43cb26521d5f5d239035"
