name: Import Quaternius Pack 2 Ultimate Nature assets
# Every imported file is validated against the uploaded ZIP manifest.

on:
  push:
    branches:
      - pack2-import-helper
      - pack2-import-run2
    paths:
      - .github/workflows/import-pack2-ultimate-nature.yml
      - .github/pack2-authoritative.sha256

permissions:
  contents: write

concurrency:
  group: pack2-ultimate-nature-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch authoritative manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin pack2-import-helper
          git show origin/pack2-import-helper:.github/pack2-authoritative.sha256 > /tmp/pack2-authoritative.sha256
          count="$(wc -l < /tmp/pack2-authoritative.sha256 | tr -d ' ')"
          [ "$count" = "150" ] || { echo "Expected 150 manifest entries, found $count"; exit 1; }

      - name: Import exact Pack 2 assets one FBX per commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          dest_dir="assets/gamebox/quaternius/ultimate-nature"
          tmp_dir="/tmp/pack2-fbx"
          mkdir -p "$tmp_dir"
          imported=0
          skipped=0

          while read -r expected name; do
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            mkdir -p "$dest_dir"
            dest="$dest_dir/$name"

            if [ -f "$dest" ]; then
              current="$(sha256sum "$dest" | awk '{print $1}')"
              if [ "$current" != "$expected" ]; then
                echo "Existing main file differs from authoritative ZIP: $name" >&2
                exit 1
              fi
              echo "$name already present with authoritative checksum; skipping."
              skipped=$((skipped+1))
              continue
            fi

            src="$tmp_dir/$name"
            url="https://raw.githubusercontent.com/vicdotexe/3d-Editor/master/Eli/DefaultContent/Eli/Models/Trees/$name"
            rm -f "$src"
            curl -L --fail --retry 4 --retry-delay 2 "$url" -o "$src"

            actual="$(sha256sum "$src" | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "Checksum mismatch for $name" >&2
              echo "expected=$expected" >&2
              echo "actual=$actual" >&2
              exit 1
            fi

            magic="$(head -c 18 "$src")"
            if [ "$magic" != "Kaydara FBX Binary" ]; then
              echo "Unexpected FBX header for $name" >&2
              exit 1
            fi

            cp "$src" "$dest"
            verify="$(sha256sum "$dest" | awk '{print $1}')"
            [ "$verify" = "$expected" ] || { echo "Post-copy mismatch for $name"; exit 1; }

            git add "$dest"
            git commit -m "Import Quaternius Ultimate Nature $name"
            git push origin HEAD:main
            imported=$((imported+1))
          done < /tmp/pack2-authoritative.sha256

          echo "imported=$imported skipped=$skipped"
