name: Import Quaternius Pack 2 Ultimate Nature assets

on:
  push:
    branches:
      - pack2-import-helper
    paths:
      - .github/workflows/import-pack2-ultimate-nature.yml

permissions:
  contents: write

concurrency:
  group: pack2-ultimate-nature-fast-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Import next Pack 2 assets one FBX per commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          dest_dir="assets/gamebox/quaternius/ultimate-nature"
          mkdir -p "$dest_dir"
          base_url="https://raw.githubusercontent.com/Maisha617/Maze-Runner-Game-/main/Ultimate%20Nature%20Pack%20-%20Jun%202019/FBX"

          import_one() {
            name="$1"
            expected="$2"
            tmp="/tmp/$name"

            curl -L --fail --retry 3 "$base_url/$name" -o "$tmp"
            actual="$(sha256sum "$tmp" | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "Checksum mismatch for $name"
              echo "expected=$expected"
              echo "actual=$actual"
              exit 1
            fi

            magic="$(head -c 18 "$tmp")"
            if [ "$magic" != "Kaydara FBX Binary" ]; then
              echo "Unexpected FBX header for $name"
              exit 1
            fi

            git fetch origin main
            git checkout main
            git reset --hard origin/main
            mkdir -p "$dest_dir"
            dest="$dest_dir/$name"

            if [ -f "$dest" ]; then
              current="$(sha256sum "$dest" | awk '{print $1}')"
              if [ "$current" = "$expected" ]; then
                echo "$name already present with exact checksum; skipping."
                return 0
              fi
              echo "$name already exists but checksum differs; refusing to overwrite."
              exit 1
            fi

            cp "$tmp" "$dest"
            verify="$(sha256sum "$dest" | awk '{print $1}')"
            [ "$verify" = "$expected" ] || { echo "Post-copy checksum mismatch for $name"; exit 1; }

            git add "$dest"
            git commit -m "Import Quaternius Ultimate Nature $name"
            git push origin HEAD:main
          }

          import_one "Bush_1.fbx" "ef4fd15c36fd95a19aa769a15b4acde2a22bbfea4ada7144ece5fd82c2e05a0f"
          import_one "Bush_2.fbx" "73a9aa512b2967ad333451ffb4b4e460f400a7a17a73a0b90fc1656404273388"
          import_one "Bush_Snow_1.fbx" "49b33c2b7379de7194af89c0262ef648ba99ea3c4de47e961c297e067ac7bd85"
          import_one "Bush_Snow_2.fbx" "22ef7a5ffddfb257f09d96540349b7ed4c25cb04e5f9bf5be4836ea6eff346bc"
          import_one "CactusFlower_1.fbx" "203723aa277e0297eccc145d2d9714fa4649dac84d475b9ed60957791cbfe9a0"
          import_one "CactusFlowers_2.fbx" "28e9efc16d2e9dd4720444cea6d583c10a3a97845ab8ac55282d36c2d28d62a9"
          import_one "CactusFlowers_3.fbx" "0dec00002d8e3b30ebb582e5bb15bef4496ddce5916ce175caceafc96d35609a"
          import_one "CactusFlowers_4.fbx" "fb014c097af2ae320790eb263577e08003a8a489aa3d43cb26521d5f5d239035"
          import_one "CactusFlowers_5.fbx" "72ed23784ac6523427f0b2bed0958365d346a4e160bf284c41d16ae56c7d62ce"
          import_one "Cactus_1.fbx" "1d759855d5a04c08ba37d1f1db60f58f32b4e4d6942cb01e91ad7383fb8511f2"
          import_one "Cactus_2.fbx" "a6cbd5dd51ed796ef0e6ccb50a724161968683675086b4419d95f4e0dd82ee08"
          import_one "Cactus_3.fbx" "4b360e286681f9bb6e92f4d6166df5dac8718e61b056fd5dc10bbf8beffadbbd"
          import_one "Cactus_4.fbx" "2be9d320c1b7984ce18ce52a52c44fa3461defeb8c9fcb998bfc00f52d895b0a"
          import_one "Cactus_5.fbx" "d8f0072b4e7b78d8f8c875f3dff13534fd41cbb3b8c4efc0a6e68176a5deb7ed"
          import_one "CommonTree_1.fbx" "0b744c9092a09bfb7228d5ecce26c665363e0f22725d3d89e356dc13789498c3"
