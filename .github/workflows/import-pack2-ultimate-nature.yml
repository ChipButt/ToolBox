name: Import Quaternius Pack 2 Ultimate Nature assets

on:
  push:
    branches:
      - pack2-import-helper
    paths:
      - .github/workflows/import-pack2-ultimate-nature.yml

permissions:
  contents: write

concurrency:
  group: pack2-ultimate-nature-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install gdown
        run: |
          python -m pip install --disable-pip-version-check gdown
          python - <<'PY2'
          import importlib
          from pathlib import Path
          m = importlib.import_module("gdown.download_folder")
          p = Path(m.__file__)
          s = p.read_text()
          if "MAX_NUMBER_FILES = 50" in s:
              p.write_text(s.replace("MAX_NUMBER_FILES = 50", "MAX_NUMBER_FILES = 1000"))
          print(p)
          PY2

      - name: Download and verify official Quaternius Pack 2 FBX source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/quaternius
          mkdir -p /tmp/quaternius
          gdown --folder "https://drive.google.com/drive/folders/1-Kl0L_Jg8awbh0S5T-z3zxh4mVlnxTpa?usp=sharing" -O /tmp/quaternius || true

          fbx_dir="$(find /tmp/quaternius -type d -name FBX -print -quit)"
          [ -n "$fbx_dir" ] || { echo "Official FBX directory not found"; find /tmp/quaternius -maxdepth 4 -type f | head -100; exit 1; }

          count="$(find "$fbx_dir" -maxdepth 1 -type f -name '*.fbx' | wc -l | tr -d ' ')"
          [ "$count" = "150" ] || { echo "Expected 150 official FBX files, found $count"; exit 1; }

          : > /tmp/pack2-fbx-manifest.sha256
          while IFS= read -r name; do
            hash="$(sha256sum "$fbx_dir/$name" | awk '{print $1}')"
            printf '%s  %s\n' "$hash" "$name" >> /tmp/pack2-fbx-manifest.sha256
          done < <(find "$fbx_dir" -maxdepth 1 -type f -name '*.fbx' -printf '%f\n' | LC_ALL=C sort)

          actual_manifest_hash="$(sha256sum /tmp/pack2-fbx-manifest.sha256 | awk '{print $1}')"
          expected_manifest_hash="e4d8b3343ce35e4f57f7c6c48ccc42f939d55695882d62ee2a65c9e23250909d"
          [ "$actual_manifest_hash" = "$expected_manifest_hash" ] || {
            echo "Official Pack 2 FBX manifest does not match uploaded ZIP"
            echo "expected=$expected_manifest_hash"
            echo "actual=$actual_manifest_hash"
            exit 1
          }
          echo "$fbx_dir" > /tmp/pack2-fbx-dir

      - name: Import verified batch one FBX per commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          src_dir="$(cat /tmp/pack2-fbx-dir)"
          dest_dir="assets/gamebox/quaternius/ultimate-nature"

          import_one() {
            name="$1"
            expected="$2"
            src="$src_dir/$name"

            [ -f "$src" ] || { echo "Missing source: $name"; exit 1; }
            actual="$(sha256sum "$src" | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "Checksum mismatch for $name"
              echo "expected=$expected"
              echo "actual=$actual"
              exit 1
            fi

            magic="$(head -c 18 "$src")"
            [ "$magic" = "Kaydara FBX Binary" ] || { echo "Unexpected FBX header for $name"; exit 1; }

            git fetch origin main
            git checkout main
            git reset --hard origin/main
            mkdir -p "$dest_dir"
            dest="$dest_dir/$name"

            if [ -f "$dest" ]; then
              current="$(sha256sum "$dest" | awk '{print $1}')"
              if [ "$current" = "$expected" ]; then
                echo "$name already present with exact checksum; skipping."
                return 0
              fi
              echo "$name exists with different bytes; refusing overwrite."
              exit 1
            fi

            cp "$src" "$dest"
            verify="$(sha256sum "$dest" | awk '{print $1}')"
            [ "$verify" = "$expected" ] || { echo "Post-copy checksum mismatch for $name"; exit 1; }

            git add "$dest"
            git commit -m "Import Quaternius Ultimate Nature $name"
            git push origin HEAD:main
          }

          import_one "BushBerries_1.fbx" "1e70f836ae535b5e8bc7096abfa5f7fe2517ea8baa6d06964eff5296e39d7edc"
          import_one "BushBerries_2.fbx" "02c360d6c2738e3ef42610aee3b00604ff2c5722cb6b773e23fa78f6d38cece4"
          import_one "Bush_1.fbx" "ef4fd15c36fd95a19aa769a15b4acde2a22bbfea4ada7144ece5fd82c2e05a0f"
          import_one "Bush_2.fbx" "73a9aa512b2967ad333451ffb4b4e460f400a7a17a73a0b90fc1656404273388"
          import_one "Bush_Snow_1.fbx" "49b33c2b7379de7194af89c0262ef648ba99ea3c4de47e961c297e067ac7bd85"
          import_one "Bush_Snow_2.fbx" "22ef7a5ffddfb257f09d96540349b7ed4c25cb04e5f9bf5be4836ea6eff346bc"
          import_one "CactusFlower_1.fbx" "203723aa277e0297eccc145d2d9714fa4649dac84d475b9ed60957791cbfe9a0"
          import_one "CactusFlowers_2.fbx" "28e9efc16d2e9dd4720444cea6d583c10a3a97845ab8ac55282d36c2d28d62a9"
          import_one "CactusFlowers_3.fbx" "0dec00002d8e3b30ebb582e5bb15bef4496ddce5916ce175caceafc96d35609a"
          import_one "CactusFlowers_4.fbx" "fb014c097af2ae320790eb263577e08003a8a489aa3d43cb26521d5f5d239035"
