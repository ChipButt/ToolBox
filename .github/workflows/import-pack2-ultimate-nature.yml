name: Import Quaternius Pack 2 Ultimate Nature assets
# clean trigger

on:
  push:
    branches:
      - pack2-import-helper
      - pack2-import-run2
    paths:
      - .github/workflows/import-pack2-ultimate-nature.yml
      - .github/pack2-authoritative.sha256

permissions:
  contents: write

concurrency:
  group: pack2-ultimate-nature-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch authoritative manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin pack2-import-helper
          git show origin/pack2-import-helper:.github/pack2-authoritative.sha256 > /tmp/pack2-authoritative.sha256
          count="$(wc -l < /tmp/pack2-authoritative.sha256 | tr -d ' ')"
          [ "$count" = "150" ] || { echo "Expected 150 manifest entries, found $count"; exit 1; }

      - name: Download Pack 2 FBX transfer copy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pack2-transfer /tmp/quaternius
          mkdir -p /tmp/quaternius
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Maisha617/Maze-Runner-Game-.git /tmp/pack2-transfer
          cd /tmp/pack2-transfer
          git sparse-checkout set "Ultimate Nature Pack - Jun 2019/FBX"
          git checkout main
          git lfs install --local
          git lfs pull --include="Ultimate Nature Pack - Jun 2019/FBX/*.fbx" --exclude=""
          cp -a "Ultimate Nature Pack - Jun 2019/FBX" /tmp/quaternius/FBX
          count="$(find /tmp/quaternius/FBX -maxdepth 1 -type f -name '*.fbx' | wc -l | tr -d ' ')"
          [ "$count" = "150" ] || { echo "Expected 150 transfer FBX files, found $count"; exit 1; }

      - name: Import exact matches one FBX per commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fbx_dir="/tmp/quaternius/FBX"
          dest_dir="assets/gamebox/quaternius/ultimate-nature"
          : > /tmp/pack2-mismatches.txt
          imported=0
          skipped=0
          mismatched=0

          while read -r expected name; do
            src="$fbx_dir/$name"
            if [ ! -f "$src" ]; then
              echo "$name missing from transfer copy" | tee -a /tmp/pack2-mismatches.txt
              mismatched=$((mismatched+1))
              continue
            fi

            actual="$(sha256sum "$src" | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "$name expected=$expected actual=$actual" | tee -a /tmp/pack2-mismatches.txt
              mismatched=$((mismatched+1))
              continue
            fi

            magic="$(head -c 18 "$src")"
            if [ "$magic" != "Kaydara FBX Binary" ]; then
              echo "$name has unexpected FBX header" | tee -a /tmp/pack2-mismatches.txt
              mismatched=$((mismatched+1))
              continue
            fi

            git fetch origin main
            git checkout main
            git reset --hard origin/main
            mkdir -p "$dest_dir"
            dest="$dest_dir/$name"

            if [ -f "$dest" ]; then
              current="$(sha256sum "$dest" | awk '{print $1}')"
              if [ "$current" != "$expected" ]; then
                echo "Existing main file differs from authoritative ZIP: $name" >&2
                exit 1
              fi
              echo "$name already present with authoritative checksum; skipping."
              skipped=$((skipped+1))
              continue
            fi

            cp "$src" "$dest"
            verify="$(sha256sum "$dest" | awk '{print $1}')"
            [ "$verify" = "$expected" ] || { echo "Post-copy mismatch for $name"; exit 1; }

            git add "$dest"
            git commit -m "Import Quaternius Ultimate Nature $name"
            git push origin HEAD:main
            imported=$((imported+1))
          done < /tmp/pack2-authoritative.sha256

          echo "imported=$imported skipped=$skipped mismatched=$mismatched"
          if [ -s /tmp/pack2-mismatches.txt ]; then
            echo "MISMATCHES_BEGIN"
            cat /tmp/pack2-mismatches.txt
            echo "MISMATCHES_END"
          fi
