name: Import Quaternius Pack 7 Easy Animated Enemy Pack

on:
  push:
    branches:
      - pack7-import-helper
    paths:
      - .github/workflows/import-pack7-easy-animated-enemy.yml
      - .github/pack7-expected-fbx.txt
      - .github/pack7-expected-git-blobs.txt

permissions:
  contents: write

concurrency:
  group: pack7-easy-animated-enemy-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch expected Pack 7 manifests
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin pack7-import-helper
          git show origin/pack7-import-helper:.github/pack7-expected-fbx.txt > /tmp/pack7-expected-fbx.txt
          git show origin/pack7-import-helper:.github/pack7-expected-git-blobs.txt > /tmp/pack7-expected-git-blobs.txt

          count="$(wc -l < /tmp/pack7-expected-fbx.txt | tr -d ' ')"
          [ "$count" = "6" ] || { echo "Expected 6 filename entries, found $count"; exit 1; }

          blob_count="$(wc -l < /tmp/pack7-expected-git-blobs.txt | tr -d ' ')"
          [ "$blob_count" = "6" ] || { echo "Expected 6 validated blob entries, found $blob_count"; exit 1; }

      - name: Acquire validated Pack 7 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pack7-drive /tmp/pack7-source
          mkdir -p /tmp/pack7-drive /tmp/pack7-source/FBX

          verify_set() {
            local root="$1"
            local listing="/tmp/pack7-listing.txt"
            find "$root" -type f -name '*.fbx' -printf '%f\n' | LC_ALL=C sort > "$listing"

            [ "$(wc -l < "$listing" | tr -d ' ')" = "6" ] || return 1
            diff -q /tmp/pack7-expected-fbx.txt "$listing" >/dev/null || return 1

            while IFS= read -r name; do
              local matches
              matches="$(find "$root" -type f -name "$name" -print)"
              [ "$(printf '%s\n' "$matches" | sed '/^$/d' | wc -l | tr -d ' ')" = "1" ] || return 1
              local src
              src="$(printf '%s\n' "$matches" | head -n 1)"

              [ "$(head -c 18 "$src")" = "Kaydara FBX Binary" ] || return 1

              local expected_blob actual_blob
              expected_blob="$(awk -v name="$name" '$2 == name { print $1 }' /tmp/pack7-expected-git-blobs.txt)"
              [ -n "$expected_blob" ] || return 1
              actual_blob="$(git hash-object "$src")"
              [ "$actual_blob" = "$expected_blob" ] || return 1
            done < /tmp/pack7-expected-fbx.txt
          }

          echo "Trying creator-hosted Quaternius Drive source first"
          python -m pip install --disable-pip-version-check --quiet gdown
          gdown --folder "https://drive.google.com/drive/folders/1VbJIslXPWK-1KybQN6yezZrfJcw608qe?usp=sharing" -O /tmp/pack7-drive || true

          if verify_set /tmp/pack7-drive; then
            echo "Creator-hosted Drive source validated"
            while IFS= read -r name; do
              src="$(find /tmp/pack7-drive -type f -name "$name" -print -quit)"
              cp "$src" "/tmp/pack7-source/FBX/$name"
            done < /tmp/pack7-expected-fbx.txt
          else
            echo "Creator Drive unavailable/throttled or incomplete; using pinned cross-validated transfer copy"
            rm -rf /tmp/pack7-source
            mkdir -p /tmp/pack7-source/FBX

            pinned="3f511a60fa9822a7de280a8da95a863525998237"
            base="https://raw.githubusercontent.com/DevHuang1/embervale-godot/$pinned/assets/models/enemies/quaternius"

            while IFS= read -r name; do
              curl -fL --retry 4 --retry-delay 2 "$base/$name" -o "/tmp/pack7-source/FBX/$name"
            done < /tmp/pack7-expected-fbx.txt

            verify_set /tmp/pack7-source || {
              echo "Pinned transfer copy failed Pack 7 integrity validation"
              exit 1
            }
          fi

      - name: Verify final Pack 7 FBX set
        shell: bash
        run: |
          set -euo pipefail
          fbx_dir="/tmp/pack7-source/FBX"

          find "$fbx_dir" -maxdepth 1 -type f -name '*.fbx' -printf '%f\n' | LC_ALL=C sort > /tmp/pack7-final-fbx.txt

          count="$(wc -l < /tmp/pack7-final-fbx.txt | tr -d ' ')"
          [ "$count" = "6" ] || {
            echo "Expected 6 FBX source assets, found $count"
            cat /tmp/pack7-final-fbx.txt
            exit 1
          }

          diff -u /tmp/pack7-expected-fbx.txt /tmp/pack7-final-fbx.txt

          while IFS= read -r name; do
            src="$fbx_dir/$name"
            [ -f "$src" ] || { echo "Missing source file: $name"; exit 1; }
            [ "$(head -c 18 "$src")" = "Kaydara FBX Binary" ] || {
              echo "Unexpected FBX header: $name"
              exit 1
            }

            expected_blob="$(awk -v name="$name" '$2 == name { print $1 }' /tmp/pack7-expected-git-blobs.txt)"
            actual_blob="$(git hash-object "$src")"
            [ "$actual_blob" = "$expected_blob" ] || {
              echo "Blob mismatch for $name"
              echo "expected=$expected_blob actual=$actual_blob"
              exit 1
            }
          done < /tmp/pack7-final-fbx.txt

      - name: Import Pack 7 one FBX asset per commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          fbx_dir="/tmp/pack7-source/FBX"
          dest_dir="assets/gamebox/quaternius/easy-animated-enemy"
          imported=0
          skipped=0

          while IFS= read -r name; do
            src="$fbx_dir/$name"
            expected="$(sha256sum "$src" | awk '{print $1}')"
            dest="$dest_dir/$name"
            done_this_asset=0

            for attempt in $(seq 1 25); do
              git fetch origin main
              git checkout main
              git reset --hard origin/main
              mkdir -p "$dest_dir"

              if [ -f "$dest" ]; then
                current="$(sha256sum "$dest" | awk '{print $1}')"
                if [ "$current" = "$expected" ]; then
                  echo "$name already present with exact checksum; skipping."
                  skipped=$((skipped+1))
                  done_this_asset=1
                  break
                fi
                echo "$name already exists on main with different bytes; refusing overwrite." >&2
                exit 1
              fi

              cp "$src" "$dest"
              verify="$(sha256sum "$dest" | awk '{print $1}')"
              [ "$verify" = "$expected" ] || { echo "Post-copy checksum mismatch for $name"; exit 1; }

              git add "$dest"
              git commit -m "Import Quaternius Easy Animated Enemy $name"

              if git push origin HEAD:main; then
                imported=$((imported+1))
                done_this_asset=1
                break
              fi

              echo "Concurrent main update while pushing $name (attempt $attempt); retrying on latest main."
              git reset --hard
            done

            [ "$done_this_asset" = "1" ] || { echo "Could not safely commit $name after retries"; exit 1; }
          done < /tmp/pack7-final-fbx.txt

          echo "imported=$imported skipped=$skipped"
