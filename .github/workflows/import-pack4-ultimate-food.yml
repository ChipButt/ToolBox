name: Import Quaternius Pack 4 Ultimate Food assets

on:
  push:
    branches:
      - pack4-import-helper
    paths:
      - .github/workflows/import-pack4-ultimate-food.yml
      - .github/pack4-expected-fbx.txt

permissions:
  contents: write

concurrency:
  group: pack4-ultimate-food-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch expected Pack 4 filenames
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin pack4-import-helper
          git show origin/pack4-import-helper:.github/pack4-expected-fbx.txt > /tmp/pack4-expected-fbx.txt
          count="$(wc -l < /tmp/pack4-expected-fbx.txt | tr -d ' ')"
          [ "$count" = "103" ] || { echo "Expected 103 filename entries, found $count"; exit 1; }

      - name: Fetch complete Ultimate Food FBX transfer copy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pack4-transfer /tmp/ultimate-food
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Aman-Anas/CSC-486-P4-Resource-Management.git /tmp/pack4-transfer
          cd /tmp/pack4-transfer
          git sparse-checkout set "assets/Ultimate Food Pack - Oct 2019/FBX"
          git checkout master
          mkdir -p /tmp/ultimate-food
          cp -a "assets/Ultimate Food Pack - Oct 2019/FBX" /tmp/ultimate-food/FBX

      - name: Verify Pack 4 FBX set
        shell: bash
        run: |
          set -euo pipefail
          fbx_dir="/tmp/ultimate-food/FBX"
          [ -d "$fbx_dir" ] || { echo "FBX directory not found"; exit 1; }

          find "$fbx_dir" -maxdepth 1 -type f -name '*.fbx' -printf '%f\n' | LC_ALL=C sort > /tmp/pack4-actual-fbx.txt
          count="$(wc -l < /tmp/pack4-actual-fbx.txt | tr -d ' ')"
          [ "$count" = "103" ] || { echo "Expected 103 FBX files, found $count"; exit 1; }

          if ! diff -u /tmp/pack4-expected-fbx.txt /tmp/pack4-actual-fbx.txt; then
            echo "Pack 4 FBX filename set does not match the expected 103-model pack"
            exit 1
          fi

          while IFS= read -r name; do
            magic="$(head -c 18 "$fbx_dir/$name")"
            [ "$magic" = "Kaydara FBX Binary" ] || { echo "Unexpected FBX header: $name"; exit 1; }
          done < /tmp/pack4-actual-fbx.txt

      - name: Import Pack 4 one FBX asset per commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          fbx_dir="/tmp/ultimate-food/FBX"
          dest_dir="assets/gamebox/quaternius/ultimate-food"
          imported=0
          skipped=0

          while IFS= read -r name; do
            src="$fbx_dir/$name"
            expected="$(sha256sum "$src" | awk '{print $1}')"

            git fetch origin main
            git checkout main
            git reset --hard origin/main
            mkdir -p "$dest_dir"
            dest="$dest_dir/$name"

            if [ -f "$dest" ]; then
              current="$(sha256sum "$dest" | awk '{print $1}')"
              if [ "$current" = "$expected" ]; then
                echo "$name already present with exact checksum; skipping."
                skipped=$((skipped+1))
                continue
              fi
              echo "$name already exists on main with different bytes; refusing overwrite." >&2
              exit 1
            fi

            cp "$src" "$dest"
            verify="$(sha256sum "$dest" | awk '{print $1}')"
            [ "$verify" = "$expected" ] || { echo "Post-copy checksum mismatch for $name"; exit 1; }

            git add "$dest"
            git commit -m "Import Quaternius Ultimate Food $name"
            git push origin HEAD:main
            imported=$((imported+1))
          done < /tmp/pack4-actual-fbx.txt

          echo "imported=$imported skipped=$skipped"
