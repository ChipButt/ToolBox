name: Build harvest vegetable photo set v6

on:
  push:
    paths:
      - ".github/workflows/build-harvest-vegetables.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install --quiet pillow requests "rembg[cpu]"
      - name: Download and standardise real stock photographs
        shell: python
        run: |
          import io, os, zipfile, requests
          from PIL import Image, ImageDraw
          from rembg import remove, new_session

          OUT="harvest-vegetables-2000x2000"
          os.makedirs(OUT, exist_ok=True)
          S=2000
          headers={"User-Agent":"Mozilla/5.0 (compatible; image-prep/1.0)"}

          # Each source is a real Pexels photograph containing one principal vegetable.
          photos=[
            ("01_carrot",       5621248,  "https://www.pexels.com/photo/top-view-of-a-carrot-on-an-orange-surface-5621248/", None),
            ("02_beetroot",       244394,  "https://www.pexels.com/photo/purple-beet-244394/", None),
            ("03_potato",       33948200,  "https://www.pexels.com/photo/minimalist-portrait-of-a-single-potato-33948200/", None),
            ("04_onion",         7889980,  "https://www.pexels.com/photo/close-up-shot-of-onions-on-a-white-surface-7889980/", (0.24,0.22,0.51,0.735)),
            ("05_garlic",        5973583,  "https://www.pexels.com/photo/close-up-shot-of-a-garlic-5973583/", None),
            ("06_cauliflower",  23235238,  "https://www.pexels.com/photo/cauliflower-on-gray-background-23235238/", None),
            ("07_sweetcorn",     5343431,  "https://www.pexels.com/photo/a-corn-on-the-cob-5343431/", None),
            ("08_butternut",     4187617,  "https://www.pexels.com/photo/butternut-squash-in-close-up-photography-4187617/", None),
            ("09_pumpkin",       5474395,  "https://www.pexels.com/photo/yellow-pumpkin-on-white-surface-5474395/", None),
            ("10_courgette",    11643027,  "https://www.pexels.com/photo/green-vegetable-on-brown-wooden-table-11643027/", None),
          ]

          def fetch(photo_id):
            url=f"https://images.pexels.com/photos/{photo_id}/pexels-photo-{photo_id}.jpeg"
            r=requests.get(url,headers=headers,timeout=90)
            r.raise_for_status()
            return Image.open(io.BytesIO(r.content)).convert("RGB"), url

          session=new_session("u2net")

          def isolate_to_square(im):
            # Background removal only: this is not generative; the vegetable remains the real source photograph.
            rgba=remove(im, session=session).convert("RGBA")
            alpha=rgba.getchannel("A")
            bbox=alpha.getbbox()
            if not bbox:
              raise RuntimeError("Background removal returned an empty subject")
            subject=rgba.crop(bbox)

            # Keep a substantial clean margin so every final image has matching composition.
            max_side=int(S*0.82)
            scale=min(max_side/subject.width,max_side/subject.height)
            nw=max(1,round(subject.width*scale))
            nh=max(1,round(subject.height*scale))
            subject=subject.resize((nw,nh),Image.Resampling.LANCZOS)

            canvas=Image.new("RGBA",(S,S),(255,255,255,255))
            x=(S-nw)//2
            y=(S-nh)//2
            canvas.alpha_composite(subject,(x,y))
            return canvas.convert("RGB")

          rows=[]
          sources=[]
          for name,pid,page,crop_norm in photos:
            im,direct=fetch(pid)
            w,h=im.size
            if crop_norm:
              l,t,r,b=crop_norm
              im=im.crop((round(l*w),round(t*h),round(r*w),round(b*h)))
            out=isolate_to_square(im)
            fp=os.path.join(OUT,name+".png")
            out.save(fp,"PNG",optimize=True)
            rows.append((name,out.copy(),im.size))
            sources.append(
              f"{name}.png\n"
              f"Source page: {page}\n"
              f"Direct photograph: {direct}\n"
              f"Pexels: Free to use under the Pexels licence.\n"
              f"Original dimensions downloaded: {w}x{h}\n"
              f"Processing: background removed, subject fitted to a white 2000x2000 canvas; no generative image creation.\n"
              f"Output: 2000x2000 PNG\n"
            )

          thumb=500
          label_h=70
          sheet=Image.new("RGB",(thumb*5,(thumb+label_h)*2),"white")
          d=ImageDraw.Draw(sheet)
          for i,(name,im,origsz) in enumerate(rows):
            x=(i%5)*thumb
            y=(i//5)*(thumb+label_h)
            sheet.paste(im.resize((thumb,thumb),Image.Resampling.LANCZOS),(x,y))
            d.text((x+8,y+thumb+8),name,fill="black")
            d.text((x+8,y+thumb+28),f"source {origsz[0]}x{origsz[1]} → 2000x2000",fill="black")
          sheet.save(os.path.join(OUT,"CONTACT_SHEET.jpg"),"JPEG",quality=94)

          with open(os.path.join(OUT,"SOURCES.txt"),"w",encoding="utf-8") as fh:
            fh.write("\n\n".join(sources))

          with zipfile.ZipFile("harvest-vegetables-2000x2000.zip","w",zipfile.ZIP_DEFLATED) as z:
            for fn in sorted(os.listdir(OUT)):
              if fn.endswith(".png") or fn=="SOURCES.txt":
                z.write(os.path.join(OUT,fn),fn)
      - name: Upload set and contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: harvest-vegetables-2000x2000-v6
          path: |
            harvest-vegetables-2000x2000.zip
            harvest-vegetables-2000x2000/CONTACT_SHEET.jpg
          if-no-files-found: error
          retention-days: 1
