name: Identify player reference
on:
  push:
    paths:
      - '.github/workflows/identify-player-reference.yml'
jobs:
  identify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match reference against Time Fantasy character frames
        run: |
          python3 -m pip install pillow -q
          cat > /tmp/match.py <<'PY'
          import base64,gzip,re,io
          from pathlib import Path
          from PIL import Image
          REF_B64=""
          ref=Image.open(io.BytesIO(base64.b64decode(REF_B64))).convert('RGBA')
          print('REFERENCE',ref.size)
          chunks=[]
          for p in sorted(Path('.').glob('world-builder-tf-data-*.js')):
              t=p.read_text()
              m=re.search(r'\+"([^"]*)";?\s*$',t)
              if not m:
                  m=re.search(r'="([^"]*)";?\s*$',t)
              if not m: raise RuntimeError(f'No pack chunk in {p}')
              chunks.append(m.group(1))
          b=gzip.decompress(base64.b64decode(''.join(chunks)))
          p=0; count=b[p]; p+=1
          assets={}
          for _ in range(count):
              nl=b[p]; p+=1
              name=b[p:p+nl].decode(); p+=nl
              w=int.from_bytes(b[p:p+2],'little'); p+=2
              h=int.from_bytes(b[p:p+2],'little'); p+=2
              pc=b[p]; p+=1
              palette=b[p:p+pc*4]; p+=pc*4
              rc=int.from_bytes(b[p:p+4],'little'); p+=4
              rgba=bytearray(w*h*4); pixel=0
              for _ in range(rc):
                  ln=int.from_bytes(b[p:p+2],'little'); p+=2
                  ci=b[p]*4; p+=1
                  color=palette[ci:ci+4]
                  for __ in range(ln):
                      q=pixel*4; rgba[q:q+4]=color; pixel+=1
              assets[name]=(w,h,bytes(rgba))
          candidates=['TF Gnome A.png','TF Gnome B.png','TF Jesus.png','TF Mrs Claus.png','TF Santa.png','TF Elf A.png','TF Elf B.png']
          rr=ref.tobytes()
          rows=[]
          for name in candidates:
              w,h,rgba=assets[name]
              cols=w//26; rows_n=h//36
              for idx in range(cols*rows_n):
                  sx=(idx%cols)*26; sy=(idx//cols)*36
                  frame=bytearray(26*36*4)
                  for y in range(36):
                      src=((sy+y)*w+sx)*4
                      dst=y*26*4
                      frame[dst:dst+26*4]=rgba[src:src+26*4]
                  fb=bytes(frame)
                  exact=(fb==rr)
                  diff=sum(a!=b for a,b in zip(fb,rr))
                  pixel_diff=sum(fb[i:i+4]!=rr[i:i+4] for i in range(0,len(rr),4))
                  rows.append((pixel_diff,diff,name,idx,exact))
          rows.sort()
          for row in rows[:20]: print('MATCH',row)
          if rows[0][0]!=0:
              print('BEST_NONEXACT',rows[0])
          else:
              print('EXACT',rows[0][2],rows[0][3])
          PY
          python3 /tmp/match.py
# trigger
