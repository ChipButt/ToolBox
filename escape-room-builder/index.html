<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escape Room Builder V10</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171b1b;color:#ece8db;font:15px/1.5 system-ui}header,main{max-width:1400px;margin:auto;padding:18px}header,nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}header{justify-content:space-between;border-bottom:1px solid #52605a}h1{font:normal 32px Georgia;margin:0}small{font:12px system-ui;color:#b3c2b6}main{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px}button,.file,select,input{font:inherit;}button,.file,select,input:not([type=checkbox]){border:1px solid #66736a;border-radius:5px;background:#272e2a;color:inherit;padding:7px 10px}button,.file{cursor:pointer}button:disabled{opacity:.4}.file input{display:none}.panel{background:#212824;border:1px solid #464f47;border-radius:8px;padding:16px;align-self:start}label{display:block;margin:9px 0}aside input:not([type=checkbox]),aside select{width:100%}.scene{position:relative;aspect-ratio:16/9;background:#353a34 center/100% 100% no-repeat;isolation:isolate}#empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#d4d9cc}.item{position:absolute;transform:translate(-50%,-50%)}.handle{position:absolute;inset:0;background:transparent;border:1px dashed #ddcb93;touch-action:none;cursor:move}.chosen{outline:2px solid #ebba66}.item img{width:100%}h2{font:normal 23px Georgia;margin:4px 0 10px}a{color:#dfce9d}.row{display:flex;gap:6px}.row>*{flex:1}#status{min-height:1.5em}body.play main{grid-template-columns:1fr}body.play .edit,body.play aside,[hidden]{display:none!important}fieldset{border:1px solid #505b51;margin:12px 0;padding:10px}@media(max-width:750px){main{grid-template-columns:1fr}}
.faceStrip,.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:8px 0}.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;gap:3px;background:#e6deca;color:#272b27;padding:5px;border:2px solid transparent}.tile img,.tile strong{width:100%;height:33px;object-fit:contain;text-align:center;overflow:hidden}.tile small{color:#383d37;font-size:11px;overflow-wrap:anywhere}.tile[aria-pressed=true]{border-color:#96611b;box-shadow:0 0 0 2px #edc680}.faceDialog{box-sizing:border-box;width:min(610px,94vw);max-height:88svh;overflow:auto;background:#222a25;color:#ece8db;border:1px solid #8a998d;border-radius:10px;padding:20px}.faceDialog::backdrop{background:#101511cc}.faceDialog input,.faceDialog select{width:100%;min-width:0}.faceDialog label{margin:12px 0}.faceDialog h3{margin-bottom:4px}.faceDialog footer{position:sticky;bottom:-20px;background:#222a25;padding:12px 0;display:flex;justify-content:flex-end;gap:8px}.faceDialog footer button:last-child{background:#dfcc9f;color:#282b24}.grid .tile img,.grid .tile strong{height:43px}.grid .tile strong{font:24px Georgia;display:grid;place-items:center}.layoutBar{margin-bottom:8px}.faceStrip .tile strong{font:18px Georgia}.faceStrip .tile img,.faceStrip .tile strong{height:24px}

.addPuzzleDialog{background:#222a25;color:#ece8db;border:1px solid #8a998d;border-radius:10px;padding:24px;max-width:94vw;width:min(480px,94vw)}.addPuzzleDialog::backdrop{background:#08100cbb}.addPuzzleDialog h2{margin:0 0 10px}.puzzleOptions{display:grid;gap:9px;margin:14px 0}.puzzleOptions button{display:block;text-align:left;padding:14px;background:#354239;border:1px solid #8b967f}.puzzleOptions button:hover,.puzzleOptions button:focus-visible{background:#526554}.addPuzzleDialog footer{display:flex;justify-content:flex-end}.dialRing{border:1px solid #5f6a58;padding:9px;margin:9px 0}.dialRing legend{font-weight:bold}.dialRing .row{gap:7px}.dialRing .row>*{min-width:0}.dialRing .faceStrip{grid-template-columns:repeat(5,minmax(0,1fr))}.dialHelp{font-size:12px;color:#bdc9bc}.sd-preview{display:block}
.toolboxReturn{display:inline-flex;align-items:center;text-decoration:none;white-space:nowrap;border:1px solid #66736a;border-radius:5px;background:#35443b;color:#ece8db;padding:7px 11px}.toolboxReturn:hover,.toolboxReturn:focus-visible{background:#4c6554}
</style>
<header><h1>Escape Room Builder <small>V10</small></h1><nav><a class="toolboxReturn" href="../" aria-label="Return to Chip In ToolBox">← ToolBox</a><label class="file edit">Background<input type="file" accept="image/*" id="background"></label><button id="add" class="edit">Add Puzzle</button><button id="save" class="edit">Save room</button><label class="file edit">Open room<input id="load" type="file" accept=".json"></label><button id="play">Playtest</button></nav></header>

<main><section><nav class="edit layoutBar"><label>Room layout <select id="roomLayout"><option value="base">Main layout</option><option value="portrait">Portrait layout</option></select></label><label class="file" id="portraitUpload" hidden>Choose portrait artwork<input id="portraitBg" type="file" accept="image/*"></label><button id="removePortrait" hidden>Use main artwork</button></nav><p class="edit" id="layoutHint"></p><div id="scene" class="scene"><span id="empty">Choose a background to start your room.</span></div><p id="status" role="status"></p></section><aside class="panel"><h2>Puzzle settings</h2><div id="inspector">Add a Stone Lock to place it in the room.</div></aside></main>
