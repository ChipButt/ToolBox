<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#edf7f2">
<title>ToolBox · Chip In</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@500;600;700;800&display=swap');

:root{
  --bg1:#f8fffb;
  --bg2:#eaf6f1;
  --navy:#082f68;
  --navy2:#123f78;
  --navy3:#051d43;
  --gold:#f7bd18;
  --gold2:#ffd451;
  --steel:#dbe7e2;
  --steel2:#b9ccc4;
  --ink:#17314d;
  --muted:#708090;
  --line:#cfe1da;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 0%,rgba(247,189,24,.13),transparent 28rem),
    radial-gradient(circle at 90% 10%,rgba(8,47,104,.10),transparent 32rem),
    linear-gradient(180deg,var(--bg1),var(--bg2));
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(8,47,104,.028) 1px,transparent 1px),
    linear-gradient(90deg,rgba(8,47,104,.028) 1px,transparent 1px);
  background-size:32px 32px;
  mask-image:linear-gradient(to bottom,black,transparent 78%);
}
.page{
  width:min(1120px,calc(100% - 24px));
  margin:0 auto;
  padding:22px 0 40px;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding:8px 6px 18px;
}
.brand{
  display:flex;
  align-items:center;
  gap:14px;
}
.brandLogo{
  width:118px;
  height:42px;
  object-fit:contain;
  object-position:left center;
  filter:drop-shadow(0 7px 10px rgba(8,47,104,.08));
}
.brand h1{
  margin:0;
  font-family:Fredoka,Inter,sans-serif;
  font-size:clamp(1.7rem,3vw,2.4rem);
  line-height:1;
  color:var(--navy);
  letter-spacing:-.035em;
}
.brand h1 span{color:var(--gold)}
.toolcase-wrap{
  position:relative;
  padding-top:68px;
}
.handle{
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:min(300px,42vw);
  height:92px;
  border:18px solid var(--navy3);
  border-bottom:0;
  border-radius:36px 36px 0 0;
  background:transparent;
  box-shadow:
    inset 0 0 0 3px rgba(255,255,255,.08),
    0 8px 18px rgba(8,47,104,.14);
  z-index:0;
}
.handle::after{
  content:"";
  position:absolute;
  left:18px;
  right:18px;
  top:16px;
  height:17px;
  border-radius:999px;
  background:linear-gradient(180deg,#274f80,#123461);
  box-shadow:inset 0 2px 2px rgba(255,255,255,.08);
}
.toolbox{
  position:relative;
  z-index:1;
  overflow:hidden;
  border:8px solid var(--navy3);
  border-radius:30px;
  background:
    linear-gradient(180deg,var(--navy2) 0 78px,var(--navy) 78px 100%);
  box-shadow:
    0 22px 48px rgba(8,47,104,.18),
    inset 0 0 0 2px rgba(255,255,255,.07),
    inset 0 -18px 34px rgba(0,0,0,.18);
}
.toolbox::before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:72px;
  height:7px;
  background:linear-gradient(180deg,#061b3d,#113b71);
  box-shadow:0 3px 8px rgba(0,0,0,.24);
}
.lid{
  position:relative;
  height:78px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 22px;
}
.lid-title{
  font-family:Fredoka,Inter,sans-serif;
  font-weight:700;
  font-size:1rem;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:rgba(255,255,255,.78);
}
.latch{
  position:absolute;
  bottom:-17px;
  width:54px;
  height:32px;
  border:3px solid #845f05;
  border-radius:8px 8px 12px 12px;
  background:linear-gradient(180deg,var(--gold2),var(--gold));
  box-shadow:
    0 4px 0 #624705,
    0 7px 12px rgba(0,0,0,.22),
    inset 0 2px 2px rgba(255,255,255,.48);
  z-index:3;
}
.latch.left{left:9%}
.latch.right{right:9%}
.tray{
  position:relative;
  margin:24px;
  min-height:470px;
  padding:22px;
  border:5px solid #b77c34;
  border-radius:22px;
  background:
    linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 38px),
    linear-gradient(180deg,#264c79,#143963);
  box-shadow:
    inset 0 0 0 3px rgba(255,224,177,.16),
    inset 0 18px 28px rgba(0,0,0,.22),
    0 8px 18px rgba(0,0,0,.18);
}
.tray-label{
  display:flex;
  align-items:center;
  gap:12px;
  margin:0 0 18px;
  color:#fff;
}
.tray-label strong{
  font-family:Fredoka,Inter,sans-serif;
  font-size:1.3rem;
}
.tray-label::after{
  content:"";
  height:1px;
  flex:1;
  background:linear-gradient(90deg,rgba(255,255,255,.28),transparent);
}
.tool-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}
.tool-slot{
  position:relative;
  min-height:170px;
  border:2px dashed rgba(255,255,255,.2);
  border-radius:18px;
  background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(0,0,0,.04));
  box-shadow:
    inset 0 7px 18px rgba(0,0,0,.16),
    0 1px 0 rgba(255,255,255,.05);
}
.tool-slot::before{
  content:"";
  position:absolute;
  inset:9px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.07);
}
.tool-card{
  position:relative;
  min-height:170px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:20px;
  border:3px solid rgba(255,255,255,.74);
  border-radius:16px;
  background:linear-gradient(145deg,#2d856d,#155044);
  color:#fff;
  text-align:center;
  text-decoration:none;
  box-shadow:
    0 8px 0 rgba(2,14,35,.42),
    0 14px 22px rgba(0,0,0,.22),
    inset 0 0 0 2px rgba(0,0,0,.10),
    inset 0 16px 28px rgba(255,255,255,.10);
  transition:transform .12s ease,box-shadow .12s ease;
}
.tool-card::before{
  content:"";
  position:absolute;
  inset:8px;
  border:1px solid rgba(255,255,255,.30);
  border-radius:10px;
  pointer-events:none;
}
.tool-card:active{
  transform:translateY(5px) scale(.99);
  box-shadow:0 3px 0 rgba(2,14,35,.38),0 7px 12px rgba(0,0,0,.18),inset 0 0 0 2px rgba(0,0,0,.10);
}
.tool-card-icon{
  position:relative;
  z-index:1;
  width:64px;
  height:64px;
  display:grid;
  place-items:center;
  border-radius:18px;
  background:rgba(255,255,255,.94);
  color:#155044;
  font-size:34px;
  box-shadow:0 5px 12px rgba(0,0,0,.18);
}
.tool-card strong{
  position:relative;
  z-index:1;
  font-family:Fredoka,Inter,sans-serif;
  font-size:1.2rem;
}
.tool-card small{
  position:relative;
  z-index:1;
  max-width:220px;
  color:rgba(255,255,255,.78);
  line-height:1.35;
}
.empty-state{
  grid-column:1/-1;
  min-height:230px;
  display:grid;
  place-items:center;
  text-align:center;
  padding:24px;
  border:2px dashed rgba(255,255,255,.18);
  border-radius:20px;
  background:
    radial-gradient(circle at 50% 20%,rgba(247,189,24,.08),transparent 45%),
    rgba(3,22,49,.15);
}
.empty-icon{
  width:74px;
  height:74px;
  margin:0 auto 16px;
  display:grid;
  place-items:center;
  border-radius:20px;
  background:linear-gradient(145deg,var(--gold2),var(--gold));
  color:var(--navy3);
  font-size:38px;
  font-weight:900;
  box-shadow:
    0 8px 0 #755605,
    0 14px 24px rgba(0,0,0,.2),
    inset 0 2px 3px rgba(255,255,255,.5);
}
.empty-state h2{
  margin:0;
  font-family:Fredoka,Inter,sans-serif;
  color:#fff;
  font-size:1.45rem;
}
.empty-state p{
  margin:7px 0 0;
  color:rgba(255,255,255,.62);
  font-size:.86rem;
}
.footer{
  padding:22px 0 0;
  text-align:center;
  font-size:.72rem;
  font-weight:800;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:rgba(23,49,77,.42);
}
@media(max-width:760px){
  .page{width:min(100% - 16px,1120px);padding-top:12px}
  .brandLogo{width:104px;height:36px}
  .brand h1{font-size:1.7rem}
  .toolcase-wrap{padding-top:54px}
  .handle{height:74px;border-width:14px;width:min(250px,54vw)}
  .toolbox{border-width:6px;border-radius:24px}
  .tray{margin:18px;padding:16px;min-height:410px}
  .tool-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .empty-state{min-height:260px}
}
@media(max-width:460px){
  .topbar{padding-left:3px;padding-right:3px}
  .brand{gap:9px}
  .brandLogo{width:92px;height:32px}
  .brand h1{font-size:1.45rem}
  .lid-title{font-size:.82rem}
  .tool-grid{grid-template-columns:1fr}
  .tray{margin:14px;padding:13px}
  .latch{width:44px;height:28px}
}
</style>
</head>
<body>
<main class="page">
  <header class="topbar">
    <div class="brand">
      <img class="brandLogo" src="chip_in_logo.png" alt="Chip In">
      <h1>Tool<span>Box</span></h1>
    </div>
  </header>

  <section class="toolcase-wrap" aria-label="Chip In ToolBox">
    <div class="handle" aria-hidden="true"></div>
    <div class="toolbox">
      <div class="lid">
        <div class="lid-title">Chip In Tools</div>
        <span class="latch left" aria-hidden="true"></span>
        <span class="latch right" aria-hidden="true"></span>
      </div>

      <div class="tray">
        <div class="tray-label"><strong>Tools</strong></div>
        <div class="tool-grid" id="toolGrid">
          <a class="tool-card" href="picture-crop.html" aria-label="Picture Crop Round Builder">
            <span class="tool-card-icon" aria-hidden="true">✂️</span>
            <strong>Picture Crop</strong>
            <small>Crop, blur or distort picture-round images and export them as PNGs.</small>
          </a>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">Chip In · ToolBox</footer>
</main>
</body>
</html>
